<!doctype html>
<html><head><meta charset="utf-8"><title>El colgante</title>
<style>html,body{margin:0;background:#0b1430;overflow:hidden}canvas{display:block;margin:auto;height:100vh;width:auto}</style>
</head><body>
<canvas id="c"></canvas>
<script src="pixel.js"></script>
<script src="chip.js"></script>
<script src="journey.js"></script>
<script src="pendant.js"></script>
<script>
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
buildAll(); buildPendant();
window.__meta = { W, H, FPS, DURATION: PD_DUR };
window.__draw = t => pdDraw(t, ctx);
window.__ready = true;
pdDraw(0, ctx);
if (!new URLSearchParams(location.search).has('render')) {
  let ac = null, t0 = 0;
  addEventListener('click', () => { if (ac) return; ac = new AudioContext(); t0 = ac.currentTime + .1; pdAudio(ac, master(ac), t0); requestAnimationFrame(loop); });
  function loop() { const t = ac.currentTime - t0; pdDraw(clamp(t, 0, PD_DUR - 1e-3), ctx); if (t < PD_DUR) requestAnimationFrame(loop); }
}
</script></body></html>
