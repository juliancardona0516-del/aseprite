<!doctype html>
<html><head><meta charset="utf-8"><title>The Bamboo Dance</title>
<style>html,body{margin:0;background:#0b1430;overflow:hidden}canvas{display:block;margin:auto;height:100vh;width:auto}</style>
</head><body>
<canvas id="c"></canvas>
<script src="pixel.js"></script>
<script src="chip.js"></script>
<script src="journey.js"></script>
<script src="dance.js"></script>
<script>
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
buildAll(); buildDance();
window.__meta = { W, H, FPS, DURATION: DN_DUR };
window.__draw = t => dnDraw(t, ctx);
window.__ready = true;
dnDraw(0, ctx);
if (!new URLSearchParams(location.search).has('render')) {
  let ac = null, t0 = 0;
  addEventListener('click', () => { if (ac) return; ac = new AudioContext(); t0 = ac.currentTime + .1; dnAudio(ac, master(ac), t0); requestAnimationFrame(loop); });
  function loop() { const t = ac.currentTime - t0; dnDraw(clamp(t, 0, DN_DUR - 1e-3), ctx); if (t < DN_DUR) requestAnimationFrame(loop); }
}
</script></body></html>
