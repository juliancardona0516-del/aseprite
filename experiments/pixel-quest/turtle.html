<!doctype html>
<html><head><meta charset="utf-8"><title>The Turtle</title>
<style>html,body{margin:0;background:#0b1430;overflow:hidden}canvas{display:block;margin:auto;height:100vh;width:auto}</style>
</head><body>
<canvas id="c"></canvas>
<script src="pixel.js"></script>
<script src="chip.js"></script>
<script src="journey.js"></script>
<script src="turtle.js"></script>
<script>
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
buildAll(); buildTurtle();
window.__meta = { W, H, FPS, DURATION: TT_DUR };
window.__draw = t => ttDraw(t, ctx);
window.__ready = true;
ttDraw(0, ctx);
if (!new URLSearchParams(location.search).has('render')) {
  let ac = null, t0 = 0;
  addEventListener('click', () => { if (ac) return; ac = new AudioContext(); t0 = ac.currentTime + .1; ttAudio(ac, master(ac), t0); requestAnimationFrame(loop); });
  function loop() { const t = ac.currentTime - t0; ttDraw(clamp(t, 0, TT_DUR - 1e-3), ctx); if (t < TT_DUR) requestAnimationFrame(loop); }
}
</script></body></html>
