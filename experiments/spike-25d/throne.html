  Un castillo negro en una montaña sombría bajo una luna roja; la cámara hace zoom hasta la ventana del salón del trono;
  dentro, el demonio rojo (del boceto del usuario) ordena a los orcos azules destruir la aldea; ellos bajan la montaña con
  antorchas y la aldea arde. Lo del spike: billboards paralelos a la pantalla, capas a distintas profundidades con órbita
  lenta de cámara (parallax), sombras planas, suelo de baja frecuencia, paleta cuantizada en shader con tramado, zoom x2
  entero con sprite HD, render 180x320 escalado x6 nearest, window.__draw(t) determinista. Solo efectos de sonido.

// =================================================================== palette

  D: '#b8401c', O: '#ff8a2a', f: '#ffd25a', F: '#fff3b0',
  a: '#1a2c5a', A: '#2c4e92', c: '#4f86c8', C: '#8fc2ee', E: '#45c8ff', e: '#c4f6ff',

// =================================================================== THE DEMON LORD (from the user's sketch): seated front view, 56x84; HD 112x168 for the close-up
const DW = 56, DH = 84, DX = 26, DF = 83, O = 12;
function demon(pose) {                       // 'sit' | 'glare' | 'roar'
  const X = DX, roar = pose === 'roar', L = () => new Pix(DW, DH), P = L();
  // long black hair behind the shoulders
  const hair = L(); for (let y = O + 10; y < O + 36; y++) { const sp = Math.min(5, (y - O - 10) * .35); hair.r(Math.round(X - 9 - sp), y, 5 + (y % 4 === 0 ? 1 : 0), 1, 'k'); hair.r(Math.round(X + 5 + sp), y, 5 + (y % 5 === 0 ? 1 : 0), 1, 'k'); }
  for (let k = 0; k < 6; k++) { hair.p(X - 12 - (k % 3), O + 30 + k, 'k'); hair.p(X + 11 + (k % 3), O + 31 + k, 'k'); }
  P.over(hair);
  // the axe, behind the right arm
  const axe = L(), ax = X + 21;
  if (!roar) { axe.r(ax, O + 2, 2, 68, 'W'); axe.r(ax + 1, O + 2, 1, 68, 'w'); for (let y = O + 34; y < O + 52; y += 3) axe.r(ax, y, 2, 1, 'y'); axe.r(ax - 1, O + 1, 4, 2, 'n'); }
  else { axe.r(ax, 0, 2, O + 26, 'W'); axe.r(ax + 1, 0, 1, O + 26, 'w'); for (let y = O + 10; y < O + 24; y += 3) axe.r(ax, y, 2, 1, 'y'); }
  const by = roar ? 1 : O + 3;               // the blade: a dark crescent with a bright bitten edge
  for (let j = 0; j < 22; j++) { const wdt = Math.round(8 - Math.abs(j - 11) * .45); axe.r(ax + 2, by + j, wdt, 1, 'K'); axe.p(ax + 1 + wdt, by + j, 'n'); axe.p(ax + 2 + wdt, by + j, j % 5 === 2 ? 'N' : 'n'); }
  axe.r(ax + 3, by + 6, 3, 1, 'k'); axe.r(ax + 3, by + 14, 3, 1, 'k'); axe.r(ax + 4, by + 9, 2, 3, 'b');
  for (let j = 0; j < 7; j++) axe.r(ax - 1 - Math.round(j * .5), by + 7 + j, 1, 1, 'K');   // the back spike
  P.over(axe);
  // legs: dark trousers, spiked knee plates, greaves and boots
  const legs = L();
  legs.r(X - 15, O + 46, 31, 9, 'K');
  for (const s of [-1, 1]) {
    const kx = X + s * 12;
    legs.r(kx - 4, O + 57, 9, 13, 'B'); legs.r(kx - 4, O + 57, 1, 13, 'n'); legs.r(kx + 3, O + 57, 2, 13, 'b'); legs.r(kx - 4, O + 61, 9, 1, 'b'); legs.r(kx - 4, O + 65, 9, 1, 'b');
    legs.r(kx - 5, O + 69, 11, 3, 'B'); legs.r(kx - 5, O + 69, 11, 1, 'n'); legs.r(kx - 5, O + 71, 11, 1, 'b');
    for (let k = 0; k < 3; k++) { legs.p(kx + s * 6, O + 59 + k * 4, 'N'); legs.p(kx + s * 7, O + 58 + k * 4, 'n'); }
    legs.disc(kx, O + 53, 5, 'B'); legs.disc(kx - 1, O + 52, 3, 'n'); legs.p(kx, O + 53, 'N'); legs.p(kx, O + 52, 'z');
  }

  body.disc(X - 14, O + 31, 6, 'r'); body.disc(X + 14, O + 31, 6, 'r');
  body.r(X - 11, O + 27, 23, 9, 'r'); body.r(X - 9, O + 36, 19, 6, 'r'); body.r(X - 7, O + 42, 15, 3, 'r');
  body.shade('r', 'h', 'R');
  body.line(X, O + 28, X, O + 44, 'R'); body.line(X - 10, O + 35, X - 1, O + 36, 'R'); body.line(X + 10, O + 35, X + 1, O + 36, 'R');
  body.r(X - 6, O + 39, 13, 1, 'R'); body.r(X - 5, O + 42, 11, 1, 'R'); body.line(X - 9, O + 28, X - 9, O + 34, 'R'); body.line(X + 9, O + 28, X + 9, O + 34, 'R');
  body.r(X - 8, O + 29, 5, 1, 'h'); body.r(X + 3, O + 29, 5, 1, 'h'); body.p(X - 17, O + 27, 'H'); body.p(X + 11, O + 27, 'H'); body.p(X - 6, O + 37, 'h'); body.p(X + 2, O + 37, 'h');

  P.over(body);

  belt.r(X - 4, O + 47, 9, 11, 'B'); for (let k = 0; k < 4; k++) { belt.line(X - 4, O + 47 + k * 3, X, O + 50 + k * 3, 'n'); belt.line(X + 4, O + 47 + k * 3, X, O + 50 + k * 3, 'b'); }
  belt.r(X - 12, O + 44, 25, 4, 'B'); belt.r(X - 12, O + 44, 25, 1, 'n'); belt.r(X - 12, O + 47, 25, 1, 'b'); for (let i = -11; i <= 11; i += 4) belt.p(X + i, O + 45, 'N');
  belt.r(X - 4, O + 43, 9, 6, 'n'); belt.r(X - 3, O + 44, 4, 1, 'N'); belt.p(X, O + 49, 'n'); belt.p(X, O + 46, 'z');
  P.over(belt);

    arms.r(X - 26, O + 40, 4, 5, 'k'); for (let k = 0; k < 3; k++) arms.p(X - 27, O + 40 + k * 2, 'n');

  hd.r(X - 5, O + 9, 11, 4, 'k'); hd.p(X, O + 13, 'k'); hd.r(X - 6, O + 11, 2, 9, 'k'); hd.r(X + 5, O + 11, 2, 9, 'k'); hd.p(X - 2, O + 10, 'K'); hd.p(X + 2, O + 9, 'K');
  hd.line(X - 6, O + 19, X - 8, O + 17, 'r'); hd.line(X + 6, O + 19, X + 8, O + 17, 'R');
  hd.line(X - 4, O + 15, X - 1, O + 16, 'R'); hd.line(X + 4, O + 15, X + 1, O + 16, 'R');

    const pts = [[X + 5 * s, O + 12], [X + 7 * s, O + 10], [X + 9 * s, O + 8], [X + 10 * s, O + 5], [X + 10 * s, O + 3], [X + 9 * s, O + 1], [X + 7 * s, O]];

function demonHD(pose) {
  return upscale(demon(pose), (P, src) => {
    for (let y = 0; y < P.h; y++) for (let x = 0; x < P.w; x++) {
      const c = src(x, y); if (c === 255) continue;
      if (c === I.k && (x + (y >> 2)) % 5 === 0) P.p(x, y, 'K');                                  // strands of hair and fur
      else if (c === I.K && (x * 3 + y) % 7 === 0) P.p(x, y, 'b');
      else if (c === I.r && hash(x >> 1, y >> 1, 5) > .93) P.p(x, y, 'h');                       // skin texture
      else if (c === I.h && src(x + 2, y + 2) === I.r && (x + y) % 3 === 0) P.p(x, y, 'H');
      else if (c === I.B && (x + y) % 9 === 0) P.p(x, y, 'n');                                   // worn metal
      else if (c === I.n && src(x - 1, y - 1) === 255) P.p(x, y, 'N');
    }
    for (let y = 0; y < P.h; y++) for (let x = 0; x < P.w; x++) if (src(x, y) === I.e) for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) if (src(x + dx, y + dy) !== I.e && src(x + dx, y + dy) !== 255) P.p(x + dx, y + dy, 'E');   // eye glow bleeds
  });
}

// =================================================================== the blue orcs (18x22): back view standing / cheering, side view running (2 frames)

window.__renderAudio = async () => { const sr = 48000, ac = new OfflineAudioContext(2, Math.ceil(sr * DURATION), sr), m = ac.createGain(), c = ac.createDynamicsCompressor(); m.gain.value = .9; c.threshold.value = -14; c.ratio.value = 4; m.connect(c).connect(ac.destination); sfx(ac, m); return encodeWav(await ac.startRendering()); };

const params = new URLSearchParams(location.search), RENDER = params.has('render');
