  Un rōnin frente a un dragón colosal ante la pagoda y la cascada de Nachi (Wakayama), en tres momentos:
  1) el encuentro, 2) la derrota del dragón, 3) la partida.
  Mismo pipeline que index.html: render 180x320, pase de paleta en shader, x6 nearest, sombras planas, __draw(t).
  Todo el arte se dibuja en memoria con una paleta fija. three.js 0.160.0 por import map (capture.cjs lo sirve en local).
