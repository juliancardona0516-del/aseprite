<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Spike 2.5D pixel art</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  SPIKE AISLADO — pixel art "2.5D" (sprites billboard en una escena 3D).
  No forma parte de Aseprite ni de la skill de Pixelbolt; solo lee los PNG que Pixelbolt exporta (assets/sprites.js).
  Única dependencia: three.js 0.160.0 desde CDN (import map). capture.cjs lo sirve en local para exportar.
  Ver README.md en esta carpeta.
-->
<style>
  :root { --bg: #14161c; --panel: #1f232c; --text: #d7dbe3; --muted: #8b93a3; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  #wrap { display: flex; gap: 16px; padding: 16px; align-items: flex-start; flex-wrap: wrap; }
  #out { height: min(92vh, 960px); aspect-ratio: 9 / 16; image-rendering: pixelated; background: #000; display: block; }
  #panel { background: var(--panel); border-radius: 8px; padding: 12px 14px; width: 310px; }
  #panel h1 { font-size: 14px; margin: 0 0 8px; }
  #panel h2 { font-size: 12px; margin: 12px 0 4px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  #panel label { display: grid; grid-template-columns: 112px 1fr 44px; gap: 6px; align-items: center; margin: 5px 0; }
  #panel label.chk { grid-template-columns: 1fr; }
  #panel select, #panel input[type=range] { width: 100%; }
  #panel .val { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  #panel p { color: var(--muted); margin: 8px 0 0; }
  body.render #panel { display: none; }
  body.render #wrap { padding: 0; }
  body.render #out { height: auto; width: 1080px; }
</style>
<script src="assets/sprites.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js" } }</script>
</head><body>
<div id="wrap">
  <canvas id="out" width="1080" height="1920"></canvas>
  <div id="panel">
    <h1>Spike 2.5D · billboards + sol</h1>
    <label class="chk"><span><input type="checkbox" id="auto" checked> Animación automática (cámara + sol)</span></label>
    <h2>Cámara</h2>
    <label>Giro <input type="range" id="yaw" min="-180" max="180" value="45"><span class="val" id="yawV"></span></label>
    <label>Inclinación <input type="range" id="pitch" min="30" max="75" value="50"><span class="val" id="pitchV"></span></label>
    <label>Rotación <select id="camMode"><option value="d8">8 direcciones + fundido</option><option value="d16">16 direcciones + fundido</option><option value="cont">continua</option></select><span></span></label>
    <label class="chk"><span><input type="checkbox" id="snap" checked> Ajustar cámara a la rejilla de píxel</span></label>
    <h2>Sol y sombras</h2>
    <label>Azimut <input type="range" id="sunAz" min="-180" max="180" value="-60"><span class="val" id="sunAzV"></span></label>
    <label>Altura <input type="range" id="sunEl" min="10" max="85" value="38"><span class="val" id="sunElV"></span></label>
    <label>Sombra <select id="shadowMode"><option value="planar">plana (sprite proyectado)</option><option value="sun">shadow map · cara al sol</option><option value="billboard">shadow map · cara a cámara</option></select><span></span></label>
    <label>Filtro shadow map <select id="shadowType"><option value="basic">duro (Basic)</option><option value="pcf">suave (PCF)</option></select><span></span></label>
    <h2>Estética</h2>
    <label class="chk"><span><input type="checkbox" id="quant" checked> Cuantizar a la paleta</span></label>
    <label>Tramado <input type="range" id="spread" min="0" max="12" value="0"><span class="val" id="spreadV"></span></label>
    <label>Suelo <select id="ground"><option value="soft">manchas grandes</option><option value="fine">dither fino (antes)</option></select><span></span></label>
    <label>Sprites <select id="sprites"><option value="pixelbolt">PNG de Pixelbolt</option><option value="grid">cuadrículas del spike</option></select><span></span></label>
    <label>Corrección vertical <select id="correct"><option value="tilt">inclinar hacia cámara</option><option value="stretch">estirar alto 1/sen</option><option value="none">ninguna (vertical)</option></select><span></span></label>
    <label class="chk"><span><input type="checkbox" id="lit"> Iluminar sprites (doble sombreado)</span></label>
    <label>Resolución interna <select id="res"><option value="6">180×320 (×6)</option><option value="4">270×480 (×4)</option><option value="3">360×640 (×3)</option></select><span></span></label>
    <p>Teclas: ←/→ gira la cámara, ↑/↓ inclina, A/D mueve el sol, espacio pausa la animación.</p>
  </div>
</div>

  post.uniforms.quant.value = P.quant && palReady ? 1 : 0; post.uniforms.spread.value = P.spread / 100;
  gl.setRenderTarget(null); gl.render(postScene, postCam);
  octx.imageSmoothingEnabled = false; octx.drawImage(gl.domElement, 0, 0, IW, IH, 0, 0, OUT_W, OUT_H);
  return { ...A, yaw: yawNow };
}

// ------------------------------------------------------------------ the palette for the final pass: every colour the scene is drawn with
function collectPalette(canvases) {
  const count = new Map(), hex = (r, g, b) => (r << 16) | (g << 8) | b;
  for (const c of canvases) { const d = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, c.width, c.height).data; for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 127) { const k = hex(d[i], d[i + 1], d[i + 2]); count.set(k, (count.get(k) || 0) + 1); } }
  for (const h of [BG, SHADOW]) { const k = parseInt(h.slice(1), 16); count.set(k, 1e9); }
  const cols = [...count.entries()].sort((a, b) => b[1] - a[1]).slice(0, MAXPAL).map(([k]) => k);
  cols.forEach((k, i) => post.uniforms.pal.value[i].set((k >> 16 & 255) / 255, (k >> 8 & 255) / 255, (k & 255) / 255));
  post.uniforms.palN.value = cols.length; palReady = true;
  return cols.length;
}

// ------------------------------------------------------------------ controls
const KEYS = ['yaw', 'pitch', 'sunAz', 'sunEl'];
function syncUI(A) { for (const k of KEYS) { if (P.auto) ui(k).value = Math.round(A[k]); ui(k + 'V').textContent = Math.round(P.auto ? A[k] : P[k]) + '°'; } ui('spreadV').textContent = P.spread; }
const stopAuto = () => { if (!P.auto) return; P.auto = false; ui('auto').checked = false; for (const k of KEYS) P[k] = +ui(k).value; };
for (const k of KEYS) ui(k).addEventListener('input', () => { stopAuto(); P[k] = +ui(k).value; });
for (const k of ['camMode', 'shadowMode', 'shadowType', 'ground', 'correct']) ui(k).addEventListener('change', () => { P[k] = ui(k).value; manual.shown = null; });
ui('sprites').addEventListener('change', () => setSprites(ui('sprites').value));
for (const k of ['snap', 'quant', 'lit']) ui(k).addEventListener('change', () => { P[k] = ui(k).checked; });
ui('spread').addEventListener('input', () => { P.spread = +ui('spread').value; });
ui('auto').addEventListener('change', () => { P.auto = ui('auto').checked; if (!P.auto) for (const k of KEYS) P[k] = +ui(k).value; });
ui('res').addEventListener('change', () => { P.res = +ui('res').value; setResolution(P.res); });
addEventListener('keydown', e => {
  const step = { ArrowLeft: ['yaw', -(stepOf() || 3)], ArrowRight: ['yaw', stepOf() || 3], ArrowUp: ['pitch', 2], ArrowDown: ['pitch', -2], KeyA: ['sunAz', -4], KeyD: ['sunAz', 4] }[e.code];
  if (e.code === 'Space') { P.auto = !P.auto; ui('auto').checked = P.auto; if (!P.auto) for (const k of KEYS) P[k] = +ui(k).value; e.preventDefault(); }
  if (step) { stopAuto(); const [k, d] = step; P[k] = Math.max(+ui(k).min, Math.min(+ui(k).max, P[k] + d)); ui(k).value = P[k]; e.preventDefault(); }
});
function setSprites(which) {
  if (!SET[which]) which = 'grid';
  P.sprites = which; ui('sprites').value = which;
  for (const [k, list] of Object.entries(SET)) for (const b of list) for (const m of b.group) { if (k === which) scene.add(m); else scene.remove(m); }
}

// ------------------------------------------------------------------ boot
(async () => {
  for (const k of ['camMode', 'shadowMode', 'shadowType', 'ground', 'correct', 'sprites']) if (params.has(k)) P[k] = params.get(k);
  for (const k of ['snap', 'quant', 'lit']) if (params.has(k)) P[k] = params.get(k) !== '0';
  for (const k of ['res', 'spread']) if (params.has(k)) P[k] = +params.get(k);
  if (params.has('fade')) TRANSITION = Math.max(1 / 120, +params.get('fade'));
  for (const k of ['camMode', 'shadowMode', 'shadowType', 'ground', 'correct', 'res', 'spread']) ui(k).value = P[k];
  for (const k of ['snap', 'quant', 'lit']) ui(k).checked = P[k];
  setResolution(P.res);
  const tree = [gridFrame(GRIDS.tree)];
  SET.grid = [makeBillboard('tree', tree, -2.2, -1.6), makeBillboard('rock', [gridFrame(GRIDS.rock)], 1.9, -.4), makeBillboard('knight', [gridFrame(GRIDS.knight)], .2, 1.2)];
  const PB = window.PIXELBOLT_SPRITES, canvases = [groundCanvas(P.ground), ...tree.map(f => f.canvas)];
  if (PB) {
    const knight = await Promise.all(PB.knight.map(pngFrame)), rock = await Promise.all(PB.rock.map(pngFrame));
    SET.pixelbolt = [makeBillboard('tree', tree, -2.2, -1.6), makeBillboard('rock', rock, 1.9, -.4), makeBillboard('knight', knight, .2, 1.2)];
    canvases.push(...knight.map(f => f.canvas), ...rock.map(f => f.canvas));
  } else console.warn('assets/sprites.js not found: using the in-memory sprites');
  canvases.push(...SET.grid.flatMap(b => b.frames.map(f => f.canvas)), groundCanvas('soft'), groundCanvas('fine'));
  collectPalette(canvases);
  setSprites(P.sprites);
  window.__meta = { W: OUT_W, H: OUT_H, FPS, DURATION };
  window.__draw = t => draw(t);
  window.__ready = true;
  if (!RENDER) { const t0 = performance.now(); (function loop() { syncUI(draw((performance.now() - t0) / 1000)); requestAnimationFrame(loop); })(); }
  else draw(0);
})();
</script>
</body></html>
